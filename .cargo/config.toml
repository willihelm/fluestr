# Where the generated TypeScript lands (P6).
#
# ts-rs writes to `$TS_RS_EXPORT_DIR` and would otherwise put a `bindings/`
# directory next to the crate that declared the types — which is Rust's side of
# the tree, not the side that imports them. Setting it here rather than in the
# `just` recipe means the files land in the same place whoever ran the test:
# `cargo test`, a run from an editor, or CI.
#
# `relative = true` resolves it against this file's directory, so it is the
# repository root regardless of where cargo was invoked from.
[env]
TS_RS_EXPORT_DIR = { value = "ui/src/lib/generated", relative = true }
# `number`, not the `bigint` ts-rs defaults to for 64-bit integers.
#
# What matters is what actually crosses the bridge, and that is JSON: serde
# writes a `u64` as a bare number and `JSON.parse` reads every bare number as a
# `number`. Bindings that promised `bigint` would be describing a value the
# frontend never receives — every arithmetic on a timestamp would be a type
# error against a value that is not of that type anyway.
#
# Safe for everything here: the 64-bit fields are epoch milliseconds, session
# clocks, sequence numbers and byte counters, all far inside 2^53.
TS_RS_LARGE_INT = "number"
# Without it, a Windows release build of whisper.cpp is unoptimised — see the
# file itself. whisper-rs-sys hands every `CMAKE_*` variable to CMake, and the
# file is a no-op outside MSVC, so it is safe to set for every platform.
CMAKE_PROJECT_INCLUDE = { value = ".cargo/msvc-release-flags.cmake", relative = true }

# The C runtime linked statically on Windows, because sherpa-onnx forces it:
# its prebuilt Windows archives exist only as /MT, and whisper.cpp built
# against the DLL runtime (/MD) next to them fails to link the sidecar on
# duplicate `std::` symbols (LNK2005). With `crt-static`, cc and the cmake
# crate compile whisper.cpp with /MT too, so every object agrees. It also
# means the installer no longer depends on the VC++ redistributable.
[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "target-feature=+crt-static"]
