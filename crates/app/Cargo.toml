[package]
name = "app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Tauri backend: session control, worker pool, events to the UI"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "fluestr"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
audio-core = { workspace = true, features = ["silero"] }
whisper-protocol = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tauri = { version = "2", features = [] }
# The native file dialog, for the custom model's path. Used from Rust rather
# than through its JavaScript package: the picker is one command like every
# other one here, and the frontend keeps a single way of talking to the backend.
tauri-plugin-dialog = "2"
sysinfo = { workspace = true }
reqwest = { workspace = true }
futures-util = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
if-addrs = { workspace = true }
getrandom = { workspace = true }
unicode-normalization = { workspace = true }
ts-rs = { workspace = true }

# The GPU reading (`gpu.rs`) is IOKit, which only macOS has (P18).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-io-kit = { workspace = true }
objc2-core-foundation = { workspace = true }

[dev-dependencies]
hound = { workspace = true }
# The download tests are async and need a runtime of their own; at runtime the
# app borrows Tauri's. `macros` on top of what the crate already depends on.
tokio = { workspace = true, features = ["macros"] }
# A mock Tauri app, so the LAN remote (P16) can be served and talked to without
# a window. What the socket test needs is an `AppHandle`, which is the one
# thing the command layer cannot be reached without.
tauri = { version = "2", features = ["test"] }
# A WebSocket client for that test. Already in the tree behind axum's `ws`.
tokio-tungstenite = "0.29"
