[package]
name = "app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Tauri backend: session control, worker pool, events to the UI"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "intercom2chat"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
audio-core = { workspace = true, features = ["silero"] }
whisper-protocol = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tauri = { version = "2", features = [] }
# The native file dialog, for the custom model's path. Used from Rust rather
# than through its JavaScript package: the picker is one command like every
# other one here, and the frontend keeps a single way of talking to the backend.
tauri-plugin-dialog = "2"
sysinfo = { workspace = true }
reqwest = { workspace = true }
futures-util = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
hound = { workspace = true }
# The download tests are async and need a runtime of their own; at runtime the
# app borrows Tauri's.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
