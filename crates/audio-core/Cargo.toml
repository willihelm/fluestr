[package]
name = "audio-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Capture, ring buffers, resampling and segmentation — UI-free and therefore unit-testable"

[features]
default = []
# Speech detection with Silero (P3). Off by default so the crate's own tests
# and the Windows port do not have to build whisper.cpp to run.
silero = ["dep:whisper-rs"]

[dependencies]
cpal = { workspace = true }
ringbuf = { workspace = true }
rubato = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
whisper-rs = { workspace = true, optional = true }

# The CoreAudio UID behind `DeviceId`, which cpal does not expose. Same two
# crates cpal itself binds CoreAudio with, so this adds nothing to the tree.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-audio = { workspace = true }
objc2-core-foundation = { workspace = true }
# Metal under whisper.cpp on macOS. Declared a second time rather than in the
# table above so it stays behind the same `silero` switch; cargo merges the two
# into one dependency with the features of both.
whisper-rs = { workspace = true, optional = true, features = ["metal"] }

# The WASAPI endpoint id behind `DeviceId` on Windows (P18).
[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[dev-dependencies]
hound = { workspace = true }
serde_json = { workspace = true }
