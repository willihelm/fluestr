name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Debug symbols are not needed in CI and only eat cache space.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  check:
    # arm64 runner: the target platform is Apple Silicon, and whisper.cpp with
    # Metal should be built on the same architecture it ships on.
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup show # reads rust-toolchain.toml

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # whisper-rs-sys builds whisper.cpp through cmake — that build output
          # has to be cached, otherwise every run takes several minutes.
          cache-all-crates: true
          # Save what was built even when a later step fails, so the next run
          # does not start from scratch.
          cache-on-failure: true

      # sherpa-onnx-sys downloads its prebuilt libraries into
      # target/sherpa-onnx-prebuilt and points the linker there. rust-cache
      # prunes that folder but keeps the build script's output, so the script
      # does not run again and the link fails on `sherpa-onnx-c-api`. Put the
      # archive back where the cached output expects it. The pruning deletes
      # the files but can leave the empty `lib/` behind, so look for the
      # library itself rather than the folder.
      - name: sherpa-onnx prebuilt libraries
        shell: bash
        env:
          SHERPA_PLATFORM: osx-arm64-static-lib
        run: |
          version=$(awk '/^name = "sherpa-onnx-sys"$/ { getline; gsub(/"/, "", $3); print $3 }' Cargo.lock)
          stem="sherpa-onnx-v$version-$SHERPA_PLATFORM"
          mkdir -p target/sherpa-onnx-prebuilt
          cd target/sherpa-onnx-prebuilt
          if ! compgen -G "$stem/lib/*sherpa-onnx-c-api*" > /dev/null; then
            rm -rf "$stem"
            curl -fsSL --retry 3 -o "$stem.tar.bz2" \
              "https://github.com/k2-fsa/sherpa-onnx/releases/download/v$version/$stem.tar.bz2"
            tar -xjf "$stem.tar.bz2"
          fi
          ls "$stem/lib"/*sherpa-onnx-c-api*

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ui

      - name: Formatting
        run: cargo fmt --all -- --check

      # tauri-build refuses to build `app` without its `externalBin` staged,
      # and copies it into target/debug — where the pool tests look for the
      # sidecar. It has to be the real one: a placeholder would be copied over
      # the worker cargo just built. Only ever passed locally because the
      # staged file from `just dev` sits in the ignored binaries/ folder.
      - name: Stage the sidecar
        run: |
          cargo build -p whisper-worker
          mkdir -p crates/app/binaries
          cp target/debug/whisper-worker crates/app/binaries/whisper-worker-aarch64-apple-darwin

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      # After the Rust tests, which are what write them: `cargo test` regenerates
      # the frontend's types (P6), so a diff here is a struct that changed in
      # Rust without the committed bindings being regenerated — TypeScript
      # agreeing with a backend that no longer exists.
      - name: Generated types are current
        run: git diff --exit-code -- ui/src/lib/generated

      - name: TypeScript and Svelte checks
        run: pnpm check
        working-directory: ui

      - name: Frontend tests
        run: pnpm test
        working-directory: ui

      - name: Frontend build
        run: pnpm build
        working-directory: ui

      - name: Release build
        run: cargo build --workspace --release

  windows:
    # The Windows port (P18). The frontend and the generated types are checked
    # by the macOS job — they do not depend on the platform. What this job
    # covers is everything that does: the build of whisper.cpp with MSVC, the
    # `cfg(windows)` code paths, the tests on Windows, and the installer, which
    # is uploaded so it can be tried on a real machine.
    runs-on: windows-latest
    # A cold run (debug build, clippy, tests, then the release build for the
    # installer) takes well over an hour. At 60 minutes it was cancelled in
    # the installer step — and a cancelled job never saves its cache, so every
    # run started cold again.
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup show

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
          cache-on-failure: true

      # sherpa-onnx-sys downloads its prebuilt libraries into
      # target/sherpa-onnx-prebuilt and points the linker there. rust-cache
      # prunes that folder but keeps the build script's output, so the script
      # does not run again and the link fails on `sherpa-onnx-c-api`. Put the
      # archive back where the cached output expects it. The pruning deletes
      # the files but can leave the empty `lib/` behind, so look for the
      # library itself rather than the folder.
      - name: sherpa-onnx prebuilt libraries
        shell: bash
        env:
          SHERPA_PLATFORM: win-x64-static-MT-Release-lib
        run: |
          version=$(awk '/^name = "sherpa-onnx-sys"$/ { getline; gsub(/"/, "", $3); print $3 }' Cargo.lock)
          stem="sherpa-onnx-v$version-$SHERPA_PLATFORM"
          mkdir -p target/sherpa-onnx-prebuilt
          cd target/sherpa-onnx-prebuilt
          if ! compgen -G "$stem/lib/*sherpa-onnx-c-api*" > /dev/null; then
            rm -rf "$stem"
            curl -fsSL --retry 3 -o "$stem.tar.bz2" \
              "https://github.com/k2-fsa/sherpa-onnx/releases/download/v$version/$stem.tar.bz2"
            tar -xjf "$stem.tar.bz2"
          fi
          ls "$stem/lib"/*sherpa-onnx-c-api*

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ui

      # ggml-vulkan builds against the SDK (headers, vulkan-1.lib, glslc).
      # The runner has no GPU, so the tests themselves still run on the CPU.
      - name: Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      # As in the macOS job. `build-windows.ps1` restages the release build
      # for the installer below.
      - name: Stage the sidecar
        shell: bash
        run: |
          cargo build -p whisper-worker
          mkdir -p crates/app/binaries
          cp target/debug/whisper-worker.exe crates/app/binaries/whisper-worker-x86_64-pc-windows-msvc.exe

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Installer
        run: scripts\build-windows.ps1
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: fluestr-windows-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
