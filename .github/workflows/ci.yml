name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Debug symbols are not needed in CI and only eat cache space.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  check:
    # arm64 runner: the target platform is Apple Silicon, and whisper.cpp with
    # Metal should be built on the same architecture it ships on.
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup show # reads rust-toolchain.toml

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # whisper-rs-sys builds whisper.cpp through cmake — that build output
          # has to be cached, otherwise every run takes several minutes.
          cache-all-crates: true

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ui

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      # After the Rust tests, which are what write them: `cargo test` regenerates
      # the frontend's types (P6), so a diff here is a struct that changed in
      # Rust without the committed bindings being regenerated — TypeScript
      # agreeing with a backend that no longer exists.
      - name: Generated types are current
        run: git diff --exit-code -- ui/src/lib/generated

      - name: TypeScript and Svelte checks
        run: pnpm check
        working-directory: ui

      - name: Frontend tests
        run: pnpm test
        working-directory: ui

      - name: Frontend build
        run: pnpm build
        working-directory: ui

      - name: Release build
        run: cargo build --workspace --release

  windows:
    # The Windows port (P18). The frontend and the generated types are checked
    # by the macOS job — they do not depend on the platform. What this job
    # covers is everything that does: the build of whisper.cpp with MSVC, the
    # `cfg(windows)` code paths, the tests on Windows, and the installer, which
    # is uploaded so it can be tried on a real machine.
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup show

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ui

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Installer
        run: scripts\build-windows.ps1
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: fluestr-windows-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
