[workspace]
resolver = "2"
members = [
    "crates/audio-core",
    "crates/whisper-protocol",
    "crates/whisper-worker",
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"

[workspace.dependencies]
# Internal
audio-core = { path = "crates/audio-core" }
whisper-protocol = { path = "crates/whisper-protocol" }

# Errors & logging
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The frontend's types, generated from the structs that cross the bridge rather
# than written a second time by hand (P6). A normal dependency and not a
# dev-dependency: the derive sits on the wire types themselves, so gating it
# behind a feature would mean the types the app ships and the types the
# frontend is generated from are two different compilations of one file.
#
# Default features only — `serde-compat`, which is the whole point: `camelCase`,
# `tag`/`content` and `#[serde(default)]` have to reach TypeScript exactly as
# serde applies them on the wire, not as the Rust field names happen to read.
ts-rs = "12"

# Model downloads (P11)
# rustls rather than the system TLS: the app has to be notarised and shipped to
# machines it has never seen, and a self-contained TLS stack is one fewer thing
# that can differ there.
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "stream",
    "http2",
    # A house network is not always a direct route to the internet, and a
    # download that fails behind a proxy looks like a broken URL.
    "system-proxy",
] }
futures-util = { version = "0.3", default-features = false }
sha2 = "0.10"
hex = "0.4"

# The LAN remote client (P16)
# The browser peer is served over HTTP and driven over one WebSocket. axum
# because the socket and the static build share a router, and because hyper is
# already in the tree behind reqwest — the model downloads brought it.
# Default features off: this serves one page and one socket on a house network,
# and nothing here wants form, multipart or JSON extractors.
axum = { version = "0.8", default-features = false, features = [
    "http1",
    "tokio",
    "ws",
] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }
# Which addresses this machine can be reached on. The operator picks one
# deliberately — the listener never binds 0.0.0.0 — so the picker has to be
# able to name them.
if-addrs = "0.13"
# The secret the remote's cookie and the redacted webhooks are keyed with.
# Already in the tree behind half the dependencies; named here so the one
# place that needs unpredictable bytes asks the operating system for them.
getrandom = "0.3"

# Alert terms (P17)
# Composed and decomposed umlauts are the same word to an operator, and a term
# typed on one keyboard has to match a transcript produced by the decoder.
# Default features off: this normalises, it does not segment graphemes.
unicode-normalization = { version = "0.1", default-features = false }

# Resource usage (P8)
# Default features off: this reads processes and nothing else, and the disk,
# network and component probes are work per sample that nothing here looks at.
# `multithread` stays off too — the sampler must not put a thread pool next to
# the audio threads once a second.
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
# The GPU share, which sysinfo does not report on any platform. Read straight
# out of the IO registry — see `app::gpu`. Both crates are already in the tree
# behind cpal and Tauri; naming them here makes the dependency deliberate
# rather than borrowed.
# Default features off: the crate otherwise pulls in USB, HID, serial and
# power management, none of which this reads. `libc` is what the registry
# entry points are gated behind.
objc2-io-kit = { version = "0.3", default-features = false, features = [
    "std",
    "libc",
] }

# Audio (P1/P2)
cpal = "0.16"
# Pulled in by cpal already; audio-core uses them directly for the CoreAudio
# device UID (P12), which cpal keeps to itself.
objc2-core-audio = "0.3"
objc2-core-foundation = "0.3"
# The WASAPI endpoint id behind `DeviceId` on Windows (P18), which cpal keeps
# to itself just as it does the CoreAudio UID. Pinned to the version cpal
# binds WASAPI with, so this adds features to a crate already in the tree
# rather than a second copy of it.
windows = { version = "0.54", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Devices_FunctionDiscovery",
] }
ringbuf = "0.4"
rubato = "0.16"
hound = "3.5"

# Transcription (P4)
# tracing_backend: routes whisper.cpp/ggml logs into `tracing`. Without it the
# C++ side writes on its own — and anything that accidentally lands on stdout
# corrupts the sidecar's frame protocol.
#
# No GPU backend here: `metal` does not build off macOS, so each crate that
# links whisper.cpp adds the one its target has (P18).
whisper-rs = { version = "0.16", features = ["tracing_backend"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Audio processing is realtime-critical even in debug builds: without
# optimised dependencies, resampling and whisper are unusably slow.
[profile.dev.package."*"]
opt-level = 3
